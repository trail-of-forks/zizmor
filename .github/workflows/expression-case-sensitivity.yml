name: Expression case sensitivity

on:
  push:

jobs:
  test-case-insensitive:
    runs-on: ubuntu-latest
    steps:
      # == is case-insensitive for strings
      - name: String equality is case-insensitive
        if: ${{ 'hello' == 'HELLO' }}
        run: echo "PASS"

      - name: FAIL - string equality should be case-insensitive
        if: ${{ 'hello' != 'HELLO' }}
        run: exit 1

      # != respects case-insensitivity
      - name: String inequality is case-insensitive
        if: ${{ 'abc' != 'def' }}
        run: echo "PASS"

      - name: FAIL - same strings with different case should be equal
        if: ${{ 'ABC' != 'abc' }}
        run: exit 1

      # Comparison operators are case-insensitive
      - name: Less-than is case-insensitive
        if: ${{ 'abc' < 'DEF' }}
        run: echo "PASS"

      - name: Greater-or-equal is case-insensitive
        if: ${{ 'ABC' >= 'abc' }}
        run: echo "PASS"

      # contains() is case-insensitive for strings
      - name: contains is case-insensitive
        if: ${{ contains('Hello World', 'HELLO') }}
        run: echo "PASS"

      - name: FAIL - contains should be case-insensitive
        if: ${{ !contains('Hello World', 'hello world') }}
        run: exit 1

      # contains() with arrays uses case-insensitive == semantics
      - name: Array contains is case-insensitive
        if: ${{ contains(fromJSON('["Hello"]'), 'hello') }}
        run: echo "PASS"

      - name: FAIL - array contains should be case-insensitive
        if: ${{ !contains(fromJSON('["Hello"]'), 'hello') }}
        run: exit 1

      # startsWith() is case-insensitive
      - name: startsWith is case-insensitive
        if: ${{ startsWith('Hello World', 'HELLO') }}
        run: echo "PASS"

      - name: FAIL - startsWith should be case-insensitive
        if: ${{ !startsWith('HELLO WORLD', 'hello') }}
        run: exit 1

      # endsWith() is case-insensitive
      - name: endsWith is case-insensitive
        if: ${{ endsWith('Hello World', 'WORLD') }}
        run: echo "PASS"

      - name: FAIL - endsWith should be case-insensitive
        if: ${{ !endsWith('HELLO WORLD', 'world') }}
        run: exit 1

      # Greek sigma: ς (final) and σ (non-final) both uppercase to Σ.
      # This is why we use to_uppercase() instead of to_lowercase().
      - name: Greek final sigma equals non-final sigma
        if: ${{ 'σ' == 'ς' }}
        run: echo "PASS"

      - name: FAIL - Greek sigmas should be equal
        if: ${{ 'σ' != 'ς' }}
        run: exit 1

      - name: Greek capital sigma equals final sigma
        if: ${{ 'Σ' == 'ς' }}
        run: echo "PASS"

      - name: FAIL - Greek capital and final sigma should be equal
        if: ${{ 'Σ' != 'ς' }}
        run: exit 1
