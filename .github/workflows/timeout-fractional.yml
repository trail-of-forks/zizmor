name: Fractional timeout-minutes test
on: push

jobs:
  test-fractional-timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 0.5
    steps:
      - name: Print every 10s for 5 min
        run: |
          for i in $(seq 1 30); do
            echo "$(date -u +%H:%M:%S) — iteration $i of 30"
            sleep 10
          done
          echo "Loop completed without timeout"
